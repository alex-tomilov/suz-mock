services:
  suz-mock:
    build:
      context: .
    image: suz-mock:local
    environment:
      SUZ_MOCK_ADDR: ":8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
